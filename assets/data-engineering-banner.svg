<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Johann Pasquel - Data Engineering</title>
  <desc id="desc">A dark editorial banner showing a five-stage data pipeline from source to serving.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07101f"/>
      <stop offset="0.55" stop-color="#0b1c2f"/>
      <stop offset="1" stop-color="#0b2730"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="18%" r="70%">
      <stop offset="0" stop-color="#20d5c2" stop-opacity="0.23"/>
      <stop offset="1" stop-color="#20d5c2" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#9adbd2" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#61d6c6"/>
    </marker>
  </defs>

  <rect width="1200" height="360" rx="30" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="30" fill="url(#glow)"/>
  <rect width="1200" height="360" rx="30" fill="url(#grid)"/>
  <circle cx="1030" cy="38" r="160" fill="#1dd3b0" opacity="0.08" filter="url(#soft)"/>

  <g font-family="Segoe UI, sans-serif">
    <text x="70" y="88" fill="#7de3d2" font-size="15" font-weight="650" letter-spacing="4">DATA SYSTEMS / QUITO, ECUADOR</text>
    <text x="66" y="155" fill="#f4f8fb" font-size="50" font-weight="720" letter-spacing="-1.5">Johann Pasquel</text>
    <text x="70" y="194" fill="#b9c8d6" font-size="21" font-weight="420">Reliable pipelines. Auditable data. Useful decisions.</text>
  </g>

  <g transform="translate(70 246)" font-family="Segoe UI, sans-serif">
    <g fill="#0a1727" stroke="#69dbc9" stroke-opacity="0.55">
      <rect x="0" y="0" width="150" height="55" rx="14"/>
      <rect x="202" y="0" width="150" height="55" rx="14"/>
      <rect x="404" y="0" width="150" height="55" rx="14"/>
      <rect x="606" y="0" width="150" height="55" rx="14"/>
      <rect x="808" y="0" width="150" height="55" rx="14"/>
    </g>
    <g stroke="#61d6c6" stroke-width="2" stroke-opacity="0.7" marker-end="url(#arrow)">
      <path d="M158 27.5 H191"/>
      <path d="M360 27.5 H393"/>
      <path d="M562 27.5 H595"/>
      <path d="M764 27.5 H797"/>
    </g>
    <g fill="#e9f5f3" font-size="14" font-weight="600" text-anchor="middle" letter-spacing="1">
      <text x="75" y="33">SOURCE</text>
      <text x="277" y="33">RAW</text>
      <text x="479" y="33">QUALITY</text>
      <text x="681" y="33">MODEL</text>
      <text x="883" y="33">SERVE</text>
    </g>
  </g>

  <text x="1130" y="326" text-anchor="end" fill="#7de3d2" opacity="0.8" font-family="Segoe UI, sans-serif" font-size="13" letter-spacing="2">PYTHON / SQL / POSTGRESQL</text>
</svg>
